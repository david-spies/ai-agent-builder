<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ai-Agent Builder — Architectural Flow Mapper</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800&display=swap');

:root {
  --ink: #0a0a12;
  --ink2: #12121e;
  --ink3: #1a1a28;
  --wire: #22223a;
  --wire2: #2e2e50;
  --signal: #5b5ef4;
  --signal2: #8b8ef8;
  --signal3: #3a3dcc;
  --go: #00e5a0;
  --warn: #ffa842;
  --stop: #ff4d6d;
  --data: #00c8f0;
  --dim: #3a3a5a;
  --muted: #6a6a9a;
  --ghost: #9898c8;
  --bright: #e8e8ff;
  --mono: 'Space Mono', monospace;
  --sans: 'Outfit', sans-serif;
  --glow-signal: 0 0 20px rgba(91,94,244,0.4);
  --glow-go: 0 0 20px rgba(0,229,160,0.3);
  --glow-data: 0 0 16px rgba(0,200,240,0.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--ink);
  color: var(--bright);
  font-family: var(--sans);
  overflow: hidden;
}

/* ─── SCAN LINE OVERLAY ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.04) 2px,
    rgba(0,0,0,0.04) 4px
  );
  pointer-events: none;
  z-index: 1000;
}

/* ─── LAYOUT ─── */
.shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: 52px 1fr;
  height: 100vh;
  overflow: hidden;
}

/* ─── TOPBAR ─── */
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  background: var(--ink2);
  border-bottom: 1px solid var(--wire);
  z-index: 100;
}

.logo-mark {
  width: 28px;
  height: 28px;
  background: var(--signal);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -1px;
  flex-shrink: 0;
  box-shadow: var(--glow-signal);
}

.topbar-title {
  font-weight: 700;
  font-size: 13px;
  color: var(--bright);
  letter-spacing: 0.3px;
}

.topbar-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1.5px;
}

.topbar-spacer { flex: 1; }

.topbar-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.8px;
}

.pill-signal { background: rgba(91,94,244,0.12); color: var(--signal2); border: 1px solid rgba(91,94,244,0.3); }
.pill-go { background: rgba(0,229,160,0.1); color: var(--go); border: 1px solid rgba(0,229,160,0.25); }
.pill-data { background: rgba(0,200,240,0.08); color: var(--data); border: 1px solid rgba(0,200,240,0.2); }

.pulse { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* ─── SIDEBAR ─── */
.sidebar {
  background: var(--ink2);
  border-right: 1px solid var(--wire);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-section {
  padding: 14px 14px 8px;
  border-bottom: 1px solid var(--wire);
}

.sidebar-section:last-child { border-bottom: none; flex: 1; overflow-y: auto; }

.section-head {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* ─── FLOW LIST ─── */
.flow-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  margin-bottom: 4px;
  position: relative;
}

.flow-item:hover { background: var(--ink3); border-color: var(--wire2); }

.flow-item.active {
  background: rgba(91,94,244,0.08);
  border-color: rgba(91,94,244,0.35);
}

.flow-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--signal);
  border-radius: 2px 0 0 2px;
}

.flow-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 1px;
}

.flow-info { flex: 1; min-width: 0; }

.flow-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--bright);
  margin-bottom: 2px;
  line-height: 1.3;
}

.flow-desc {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--muted);
  line-height: 1.5;
}

.flow-type {
  font-family: var(--mono);
  font-size: 7px;
  padding: 2px 5px;
  border-radius: 3px;
  letter-spacing: 0.5px;
  font-weight: 700;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}

.ft-ui { background: rgba(91,94,244,0.15); color: var(--signal2); }
.ft-data { background: rgba(0,200,240,0.1); color: var(--data); }
.ft-logic { background: rgba(0,229,160,0.1); color: var(--go); }
.ft-eval { background: rgba(255,168,66,0.1); color: var(--warn); }
.ft-security { background: rgba(255,77,109,0.1); color: var(--stop); }

/* ─── NODE LEGEND ─── */
.legend-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 8px;
  color: var(--muted);
}

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ─── CANVAS ─── */
.canvas {
  position: relative;
  overflow: hidden;
  background: var(--ink);
  background-image:
    radial-gradient(circle at 20% 20%, rgba(91,94,244,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0,200,240,0.03) 0%, transparent 50%);
}

/* grid dots */
.canvas::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, var(--wire) 1px, transparent 1px);
  background-size: 32px 32px;
  background-position: 16px 16px;
  opacity: 0.35;
  pointer-events: none;
}

#flow-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* ─── NODES ─── */
.node {
  position: absolute;
  border-radius: 10px;
  padding: 12px 14px;
  border: 1px solid var(--wire2);
  background: var(--ink2);
  cursor: pointer;
  transition: all 0.2s;
  min-width: 140px;
  max-width: 180px;
  user-select: none;
  transform: translate(-50%, -50%);
}

.node:hover {
  transform: translate(-50%, -50%) translateY(-2px);
  border-color: var(--wire2);
}

.node.lit { border-color: var(--signal) !important; box-shadow: var(--glow-signal); }
.node.lit-go { border-color: var(--go) !important; box-shadow: var(--glow-go); }
.node.lit-data { border-color: var(--data) !important; box-shadow: var(--glow-data); }
.node.lit-warn { border-color: var(--warn) !important; box-shadow: 0 0 18px rgba(255,168,66,0.3); }
.node.lit-stop { border-color: var(--stop) !important; box-shadow: 0 0 18px rgba(255,77,109,0.3); }
.node.dim-node { opacity: 0.25; transition: opacity 0.3s; }

.node-type {
  font-family: var(--mono);
  font-size: 7px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 5px;
  opacity: 0.6;
}

.node-name {
  font-weight: 700;
  font-size: 11px;
  color: var(--bright);
  line-height: 1.3;
  margin-bottom: 3px;
}

.node-sub {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--muted);
  line-height: 1.4;
}

.node-badge {
  display: inline-block;
  margin-top: 5px;
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

/* ─── STEP PANEL ─── */
.step-panel {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 680px;
  max-width: calc(100% - 40px);
  background: var(--ink2);
  border: 1px solid var(--wire2);
  border-radius: 12px;
  padding: 16px 20px;
  z-index: 50;
  display: none;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

.step-panel.show { display: block; animation: riseUp 0.2s ease; }
@keyframes riseUp { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

.step-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.step-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--signal);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  flex-shrink: 0;
  box-shadow: var(--glow-signal);
}

.step-title { font-weight: 700; font-size: 13px; color: var(--bright); flex: 1; }

.step-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}

.step-btn {
  width: 26px;
  height: 26px;
  border-radius: 5px;
  background: var(--ink3);
  border: 1px solid var(--wire2);
  color: var(--ghost);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  transition: all 0.12s;
}

.step-btn:hover { background: var(--wire2); color: var(--bright); }
.step-btn:disabled { opacity: 0.3; cursor: default; }

.step-progress {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  min-width: 36px;
  text-align: center;
}

.step-desc {
  font-size: 12px;
  color: var(--ghost);
  line-height: 1.6;
  margin-bottom: 10px;
}

.step-annotation {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.annot {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.annot-signal { background: rgba(91,94,244,0.12); color: var(--signal2); border: 1px solid rgba(91,94,244,0.25); }
.annot-go { background: rgba(0,229,160,0.1); color: var(--go); border: 1px solid rgba(0,229,160,0.2); }
.annot-data { background: rgba(0,200,240,0.08); color: var(--data); border: 1px solid rgba(0,200,240,0.18); }
.annot-warn { background: rgba(255,168,66,0.1); color: var(--warn); border: 1px solid rgba(255,168,66,0.2); }
.annot-stop { background: rgba(255,77,109,0.1); color: var(--stop); border: 1px solid rgba(255,77,109,0.2); }

/* ─── TOOLTIP ─── */
.tooltip {
  position: absolute;
  background: var(--ink3);
  border: 1px solid var(--wire2);
  border-radius: 8px;
  padding: 10px 12px;
  pointer-events: none;
  z-index: 200;
  min-width: 200px;
  max-width: 260px;
  display: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.tooltip.show { display: block; animation: fadeIn 0.12s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.tt-title { font-weight: 700; font-size: 11px; color: var(--bright); margin-bottom: 4px; }
.tt-sub { font-family: var(--mono); font-size: 9px; color: var(--muted); line-height: 1.5; }
.tt-tag { display: inline-block; margin-top: 6px; padding: 2px 6px; border-radius: 3px; font-family: var(--mono); font-size: 8px; }

/* ─── EDGE ANIMATIONS ─── */
.edge-active {
  stroke-dasharray: 8 4;
  animation: flowAnim 0.8s linear infinite;
}

@keyframes flowAnim {
  to { stroke-dashoffset: -12; }
}

/* ─── NO FLOW PLACEHOLDER ─── */
.no-flow {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  pointer-events: none;
}

.no-flow-icon { font-size: 32px; opacity: 0.2; }
.no-flow-text { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 1px; }

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--wire2); border-radius: 2px; }

/* ─── CONTROLS ─── */
.canvas-controls {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 60;
}

.ctrl-btn {
  width: 30px;
  height: 30px;
  background: var(--ink2);
  border: 1px solid var(--wire2);
  border-radius: 6px;
  color: var(--ghost);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all 0.12s;
}

.ctrl-btn:hover { background: var(--ink3); color: var(--bright); border-color: var(--signal); }
</style>
</head>
<body>

<div class="shell">

  <!-- ── TOPBAR ── -->
  <div class="topbar">
    <div class="logo-mark">Ai</div>
    <div>
      <div class="topbar-title">Ai-Agent Builder</div>
      <div class="topbar-sub">ARCHITECTURAL FLOW MAPPER v1.0</div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-pill pill-signal"><div class="pulse"></div>UI LAYER</div>
    <div class="topbar-pill pill-go"><div class="pulse"></div>LOGIC LAYER</div>
    <div class="topbar-pill pill-data"><div class="pulse"></div>DATA LAYER</div>
  </div>

  <!-- ── SIDEBAR ── -->
  <div class="sidebar">

    <div class="sidebar-section">
      <div class="section-head">Select a Flow</div>
      <div id="flow-list"></div>
    </div>

    <div class="sidebar-section" style="padding-top:12px">
      <div class="section-head">Node Legend</div>
      <div class="legend-grid">
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(91,94,244,0.5);border:1px solid var(--signal)"></div>UI Component</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(0,229,160,0.4);border:1px solid var(--go)"></div>Logic Engine</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(0,200,240,0.35);border:1px solid var(--data)"></div>Data / File</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,168,66,0.4);border:1px solid var(--warn)"></div>Eval / Judge</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,77,109,0.35);border:1px solid var(--stop)"></div>Security</div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(152,152,200,0.3);border:1px solid var(--ghost)"></div>Config / State</div>
      </div>
    </div>

  </div>

  <!-- ── CANVAS ── -->
  <div class="canvas" id="canvas">

    <svg id="flow-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arr-signal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#5b5ef4"/>
        </marker>
        <marker id="arr-go" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#00e5a0"/>
        </marker>
        <marker id="arr-data" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#00c8f0"/>
        </marker>
        <marker id="arr-warn" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#ffa842"/>
        </marker>
        <marker id="arr-stop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#ff4d6d"/>
        </marker>
        <marker id="arr-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#3a3a5a"/>
        </marker>
      </defs>
    </svg>

    <div id="nodes-layer" style="position:absolute;inset:0;pointer-events:none"></div>

    <div class="no-flow" id="no-flow">
      <div class="no-flow-icon">◈</div>
      <div class="no-flow-text">Select a flow from the sidebar to begin tracing</div>
    </div>

    <div class="canvas-controls">
      <div class="ctrl-btn" onclick="resetView()" title="Reset view">↺</div>
    </div>

    <div class="tooltip" id="tooltip"></div>
  </div>

</div>

<!-- ── STEP PANEL ── -->
<div class="step-panel" id="step-panel">
  <div class="step-header">
    <div class="step-num" id="sp-num">1</div>
    <div class="step-title" id="sp-title">Step title</div>
    <div class="step-nav">
      <div class="step-btn" id="sp-prev" onclick="prevStep()">‹</div>
      <div class="step-progress" id="sp-progress">1/5</div>
      <div class="step-btn" id="sp-next" onclick="nextStep()">›</div>
      <div class="step-btn" onclick="closeFlow()" title="Close">✕</div>
    </div>
  </div>
  <div class="step-desc" id="sp-desc"></div>
  <div class="step-annotation" id="sp-annots"></div>
</div>

<script>

        {
          nodes: ["red-team","guardrails","audit-trail"],
          edges: [["llm-judge","red-team"],["red-team","guardrails"],["red-team","audit-trail"]],
          title: "Tier C + Red Team: Adversarial Evals",
          desc: "32 adversarial probes including the canonical 7 red-team prompts (ignore instructions, DAN jailbreak, rm -rf, credential exfil, cost bypass, root access, guardrail disable). Run via scripts/eval-runner.py. Tier C checks token efficiency, wall-clock time, and cost per run. All 7 red-team prompts must pass for production certification. Results logged to audit trail.",
          annots: [
            {cls:"annot-stop", icon:"🔴", text:"7 red-team prompts: all must pass"},
            {cls:"annot-warn", icon:"→", text:"Token efficiency + cost ceiling"},
            {cls:"annot-go", icon:"⚙", text:"eval-runner.py + eval-runner.sh"},
            {cls:"annot-stop", icon:"📋", text:"Certification: audit trail entry"},
          ]
        }
      ]
    }
  ]
};

// ════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════
let state = {
  activeFlow: null,
  currentStep: 0,
  allNodeEls: {},
  canvasW: 0,
  canvasH: 0,
};

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildFlowList();
  buildAllNodes();
  drawBaseEdges();
  observeResize();
});

function observeResize() {
  const canvas = document.getElementById('canvas');
  const ro = new ResizeObserver(() => {
    state.canvasW = canvas.offsetWidth;
    state.canvasH = canvas.offsetHeight;
    repositionNodes();
    if (state.activeFlow) renderFlow(state.activeFlow, state.currentStep);
  });
  ro.observe(canvas);
  state.canvasW = canvas.offsetWidth;
  state.canvasH = canvas.offsetHeight;
}

// ════════════════════════════════════════════════════════════════
// SIDEBAR FLOW LIST
// ════════════════════════════════════════════════════════════════
function buildFlowList() {
  const container = document.getElementById('flow-list');
  appFlowData.flows.forEach(flow => {
    const el = document.createElement('div');
    el.className = 'flow-item';
    el.id = 'flow-item-' + flow.id;
    el.onclick = () => selectFlow(flow.id);
    el.innerHTML = `
      <div class="flow-icon" style="background:${iconBg(flow.type)}">${flow.icon}</div>
      <div class="flow-info">
        <div class="flow-name">${flow.name}</div>
        <div class="flow-desc">${flow.desc}</div>
      </div>
      <div class="flow-type ft-${flow.type}">${flow.type.toUpperCase()}</div>
    `;
    container.appendChild(el);
  });
}

function iconBg(type) {
  const map = {ui:'rgba(91,94,244,0.12)',logic:'rgba(0,229,160,0.1)',eval:'rgba(255,168,66,0.1)',security:'rgba(255,77,109,0.1)',data:'rgba(0,200,240,0.08)'};
  return map[type] || 'rgba(91,94,244,0.1)';
}

// ════════════════════════════════════════════════════════════════
// NODES
// ════════════════════════════════════════════════════════════════
const colorMap = {
  signal: { border:'var(--signal)', type:'rgba(91,94,244,0.08)', badge: 'rgba(91,94,244,0.15)', badgeColor: 'var(--signal2)' },
  go:     { border:'var(--go)',     type:'rgba(0,229,160,0.07)',  badge: 'rgba(0,229,160,0.12)', badgeColor: 'var(--go)' },
  data:   { border:'var(--data)',   type:'rgba(0,200,240,0.07)', badge: 'rgba(0,200,240,0.1)',  badgeColor: 'var(--data)' },
  warn:   { border:'var(--warn)',   type:'rgba(255,168,66,0.07)',badge: 'rgba(255,168,66,0.12)',badgeColor: 'var(--warn)' },
  stop:   { border:'var(--stop)',   type:'rgba(255,77,109,0.07)',badge: 'rgba(255,77,109,0.12)',badgeColor: 'var(--stop)' },
  ghost:  { border:'var(--ghost)', type:'rgba(152,152,200,0.05)',badge: 'rgba(152,152,200,0.1)',badgeColor: 'var(--ghost)' },
};

function buildAllNodes() {
  const layer = document.getElementById('nodes-layer');
  layer.style.pointerEvents = 'none';
  Object.entries(appFlowData.nodes).forEach(([id, n]) => {
    const c = colorMap[n.color] || colorMap.ghost;
    const el = document.createElement('div');
    el.className = 'node dim-node';
    el.id = 'node-' + id;
    el.style.pointerEvents = 'auto';
    el.innerHTML = `
      <div class="node-type" style="color:${c.border}">${n.type}</div>
      <div class="node-name">${n.label}</div>
      <div class="node-sub">${n.sub}</div>
      <div class="node-badge" style="background:${c.badge};color:${c.badgeColor}">${id}</div>
    `;
    el.addEventListener('mouseenter', (e) => showTooltip(e, id, n));
    el.addEventListener('mouseleave', hideTooltip);
    layer.appendChild(el);
    state.allNodeEls[id] = el;
  });
  repositionNodes();
}

function repositionNodes() {
  const W = state.canvasW || 800;
  const H = state.canvasH || 600;
  Object.entries(appFlowData.nodes).forEach(([id, n]) => {
    const el = state.allNodeEls[id];
    if (el) {
      el.style.left = (n.x * W) + 'px';
      el.style.top  = (n.y * H) + 'px';
    }
  });
}

// ════════════════════════════════════════════════════════════════
// EDGES (SVG)
// ════════════════════════════════════════════════════════════════
function getNodeCenter(nodeId) {
  const n = appFlowData.nodes[nodeId];
  const W = state.canvasW || 800;
  const H = state.canvasH || 600;
  const el = state.allNodeEls[nodeId];
  const ew = el ? el.offsetWidth : 160;
  const eh = el ? el.offsetHeight : 80;
  return {
    x: n.x * W,
    y: n.y * H,
    w: ew,
    h: eh,
  };
}

function edgePath(fromId, toId) {
  const f = getNodeCenter(fromId);
  const t = getNodeCenter(toId);
  const dx = t.x - f.x;
  const dy = t.y - f.y;
  const cx = f.x + dx * 0.4;
  const cy = f.y + dy * 0.1;
  const cx2 = f.x + dx * 0.6;
  const cy2 = t.y - dy * 0.1;
  return `M ${f.x} ${f.y} C ${cx} ${f.y}, ${cx2} ${t.y}, ${t.x} ${t.y}`;
}

function drawBaseEdges() {
  const svg = document.getElementById('flow-svg');
  // Clear existing paths except defs
  const defs = svg.querySelector('defs');
  svg.innerHTML = '';
  svg.appendChild(defs);

  appFlowData.edges.forEach((edge, i) => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('id', `edge-${i}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'var(--wire)');
    path.setAttribute('stroke-width', '1');
    path.setAttribute('opacity', '0.3');
    path.setAttribute('d', edgePath(edge.from, edge.to));
    path.setAttribute('marker-end', 'url(#arr-dim)');
    svg.appendChild(path);
  });
}

function getEdgeColor(color) {
  const map = { signal:'#5b5ef4', go:'#00e5a0', data:'#00c8f0', warn:'#ffa842', stop:'#ff4d6d' };
  return map[color] || '#5b5ef4';
}

// ════════════════════════════════════════════════════════════════
// FLOW SELECTION
// ════════════════════════════════════════════════════════════════
function selectFlow(flowId) {
  document.querySelectorAll('.flow-item').forEach(el => el.classList.remove('active'));
  document.getElementById('flow-item-' + flowId).classList.add('active');
  document.getElementById('no-flow').style.display = 'none';

  const flow = appFlowData.flows.find(f => f.id === flowId);
  state.activeFlow = flow;
  state.currentStep = 0;
  renderFlow(flow, 0);
  document.getElementById('step-panel').classList.add('show');
}

function renderFlow(flow, stepIdx) {
  const step = flow.steps[stepIdx];

  // Update step panel
  document.getElementById('sp-num').textContent = stepIdx + 1;
  document.getElementById('sp-title').textContent = step.title;
  document.getElementById('sp-desc').textContent = step.desc;
  document.getElementById('sp-progress').textContent = `${stepIdx + 1}/${flow.steps.length}`;
  document.getElementById('sp-prev').disabled = stepIdx === 0;
  document.getElementById('sp-next').disabled = stepIdx === flow.steps.length - 1;

  // Render annotations
  const annotEl = document.getElementById('sp-annots');
  annotEl.innerHTML = step.annots.map(a =>
    `<div class="annot ${a.cls}">${a.icon ? `<span>${a.icon}</span>` : ''}<span>${a.text}</span></div>`
  ).join('');

  // Highlight nodes
  const litNodes = new Set(step.nodes);
  Object.entries(state.allNodeEls).forEach(([id, el]) => {
    el.classList.remove('lit','lit-go','lit-data','lit-warn','lit-stop','dim-node');
    if (litNodes.has(id)) {
      const n = appFlowData.nodes[id];
      const cls = {signal:'lit',go:'lit-go',data:'lit-data',warn:'lit-warn',stop:'lit-stop'}[n.color] || 'lit';
      el.classList.add(cls);
    } else {
      el.classList.add('dim-node');
    }
  });

  // Highlight edges
  const svg = document.getElementById('flow-svg');
  const activeEdgePairs = new Set(step.edges.map(([a,b]) => `${a}__${b}`));

  // Redraw all edges
  const defs = svg.querySelector('defs');
  svg.innerHTML = '';
  svg.appendChild(defs);

  appFlowData.edges.forEach((edge, i) => {
    const key = `${edge.from}__${edge.to}`;
    const isActive = activeEdgePairs.has(key);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('id', `edge-${i}`);
    path.setAttribute('fill', 'none');

    if (isActive) {
      const col = getEdgeColor(edge.color);
      path.setAttribute('stroke', col);
      path.setAttribute('stroke-width', '2');
      path.setAttribute('opacity', '0.9');
      path.setAttribute('class', 'edge-active');
      path.setAttribute('marker-end', `url(#arr-${edge.color})`);
    } else {
      path.setAttribute('stroke', 'var(--wire)');
      path.setAttribute('stroke-width', '1');
      path.setAttribute('opacity', '0.15');
      path.setAttribute('marker-end', 'url(#arr-dim)');
    }
    path.setAttribute('d', edgePath(edge.from, edge.to));
    svg.appendChild(path);

    // Edge label
    if (isActive && edge.label) {
      const pathEl = path;
      const len = pathEl.getTotalLength ? pathEl.getTotalLength() : 100;
      const mid = pathEl.getPointAtLength ? pathEl.getPointAtLength(len / 2) : { x: 0, y: 0 };
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', mid.x);
      txt.setAttribute('y', mid.y - 5);
      txt.setAttribute('fill', getEdgeColor(edge.color));
      txt.setAttribute('font-size', '8');
      txt.setAttribute('font-family', 'Space Mono, monospace');
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('opacity', '0.85');
      txt.textContent = edge.label;
      svg.appendChild(txt);
    }
  });
}

function nextStep() {
  if (!state.activeFlow) return;
  if (state.currentStep < state.activeFlow.steps.length - 1) {
    state.currentStep++;
    renderFlow(state.activeFlow, state.currentStep);
  }
}

function prevStep() {
  if (!state.activeFlow) return;
  if (state.currentStep > 0) {
    state.currentStep--;
    renderFlow(state.activeFlow, state.currentStep);
  }
}

function closeFlow() {
  state.activeFlow = null;
  state.currentStep = 0;
  document.querySelectorAll('.flow-item').forEach(el => el.classList.remove('active'));
  document.getElementById('step-panel').classList.remove('show');
  document.getElementById('no-flow').style.display = 'flex';
  // Reset all nodes
  Object.values(state.allNodeEls).forEach(el => {
    el.classList.remove('lit','lit-go','lit-data','lit-warn','lit-stop');
    el.classList.add('dim-node');
  });
  drawBaseEdges();
}

function resetView() {
  repositionNodes();
  if (state.activeFlow) renderFlow(state.activeFlow, state.currentStep);
  else drawBaseEdges();
}

// ════════════════════════════════════════════════════════════════
// TOOLTIP
// ════════════════════════════════════════════════════════════════
function showTooltip(e, id, node) {
  const tt = document.getElementById('tooltip');
  const c = colorMap[node.color] || colorMap.ghost;
  tt.innerHTML = `
    <div class="tt-title">${node.label}</div>
    <div class="tt-sub">${node.sub}</div>
    <div><span class="tt-tag" style="background:${c.badge};color:${c.badgeColor}">${node.type} · ${id}</span></div>
  `;
  tt.classList.add('show');
  moveTT(e);
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('show');
}

document.getElementById('canvas').addEventListener('mousemove', moveTT);

function moveTT(e) {
  const tt = document.getElementById('tooltip');
  if (!tt.classList.contains('show')) return;
  const canvas = document.getElementById('canvas');
  const rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left + 12;
  let y = e.clientY - rect.top + 12;
  if (x + 270 > rect.width) x -= 280;
  if (y + 100 > rect.height) y -= 110;
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}

// keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextStep();
  if (e.key === 'ArrowLeft') prevStep();
  if (e.key === 'Escape') closeFlow();
});
</script>
