<svg width="1100" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"></stop>
      <stop offset="100%" stop-color="#000000"></stop>
    </linearGradient>

    <!-- Neon gradients -->
    <linearGradient id="neonGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"></stop>
      <stop offset="100%" stop-color="#4ade80"></stop>
    </linearGradient>

    <linearGradient id="neonBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"></stop>
      <stop offset="100%" stop-color="#60a5fa"></stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Scanline -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.03"></rect>
    </pattern>

    <!-- Token animation -->
    <style>
      @keyframes flow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="300" fill="url(#bg)" rx="12"></rect>
  <rect width="1100" height="300" fill="url(#scanlines)" rx="12"></rect>

  <!-- LEFT: Token Input Stream -->
  <g stroke="url(#neonGreen)" stroke-width="2" fill="none" filter="url(#glow)">
    <line x1="80" y1="80" x2="320" y2="80" stroke-dasharray="6 6" style="animation: flow 3s linear infinite"></line>
    <line x1="80" y1="120" x2="320" y2="120" stroke-dasharray="6 6" style="animation: flow 2.5s linear infinite"></line>
    <line x1="80" y1="160" x2="320" y2="160" stroke-dasharray="6 6" style="animation: flow 3.5s linear infinite"></line>
    <line x1="80" y1="200" x2="320" y2="200" stroke-dasharray="6 6" style="animation: flow 2.8s linear infinite"></line>
  </g>

  <!-- Token Nodes -->
  <g fill="#22c55e" filter="url(#glow)">
    <circle cx="80" cy="80" r="3"></circle>
    <circle cx="80" cy="120" r="3"></circle>
    <circle cx="80" cy="160" r="3"></circle>
    <circle cx="80" cy="200" r="3"></circle>
  </g>

  <!-- CENTER: Transformer Block -->
  <g transform="translate(400,70)">
    <rect width="180" height="160" rx="14" fill="#020617" stroke="url(#neonBlue)" stroke-width="2"></rect>

    <!-- Attention heads -->
    <g stroke="url(#neonGreen)" stroke-width="1.5" opacity="0.7">
      <line x1="20" y1="30" x2="160" y2="120"></line>
      <line x1="20" y1="120" x2="160" y2="30"></line>
      <line x1="60" y1="20" x2="120" y2="140"></line>
      <line x1="120" y1="20" x2="60" y2="140"></line>
    </g>

    <!-- Nodes -->
    <g fill="#3b82f6" filter="url(#glow)">
      <circle cx="20" cy="30" r="3"></circle>
      <circle cx="20" cy="120" r="3"></circle>
      <circle cx="160" cy="30" r="3"></circle>
      <circle cx="160" cy="120" r="3"></circle>
    </g>

    <!-- Label -->
    <text x="90" y="155" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
      TRANSFORMER CORE
    </text>
  </g>

  <!-- RIGHT: Output Flow -->
  <g stroke="url(#neonBlue)" stroke-width="2" fill="none" filter="url(#glow)">
    <line x1="600" y1="100" x2="900" y2="80" stroke-dasharray="5 5" style="animation: flow 3s linear infinite"></line>
    <line x1="600" y1="150" x2="900" y2="150" stroke-dasharray="5 5" style="animation: flow 2.6s linear infinite"></line>
    <line x1="600" y1="200" x2="900" y2="220" stroke-dasharray="5 5" style="animation: flow 3.2s linear infinite"></line>
  </g>

  <!-- Output Nodes -->
  <g fill="#3b82f6" filter="url(#glow)">
    <circle cx="900" cy="80" r="3"></circle>
    <circle cx="900" cy="150" r="3"></circle>
    <circle cx="900" cy="220" r="3"></circle>
  </g>

  <!-- TITLE -->
  <text x="650" y="110" font-family="monospace" font-size="38" fill="#e2e8f0" letter-spacing="1">
    AI-AGENT BUILDER
  </text>

  <!-- Subtitle -->
  <text x="650" y="145" font-family="monospace" font-size="14" fill="#22c55e">
    local-first • backend-less • agent compiler
  </text>

  <!-- Terminal-style box -->
  <g transform="translate(650,170)">
    <rect width="360" height="70" rx="8" fill="#000000" stroke="#22c55e" stroke-width="1"></rect>

    <text x="10" y="25" font-family="monospace" font-size="12" fill="#22c55e">
      &gt; build_agent --template autonomous
    </text>
    <text x="10" y="45" font-family="monospace" font-size="12" fill="#3b82f6">
      ✔ packaging agent...
    </text>
    <text x="10" y="60" font-family="monospace" font-size="12" fill="#22c55e">
      ✔ export complete
    </text>
  </g>

</svg>